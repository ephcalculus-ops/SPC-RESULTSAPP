<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="14" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="172" fill="#450a0a" stroke="url(#gold)" stroke-width="4"/>
  <!-- St. Paul College Shield Motif -->
  <!-- Cross -->
  <rect x="236" y="140" width="40" height="232" rx="8" fill="#ffffff"/>
  <rect x="160" y="200" width="192" height="40" rx="8" fill="#ffffff"/>
  <!-- Open Academic Book Base -->
  <path d="M 170 340 Q 256 310 256 340 Q 256 310 342 340 L 332 375 Q 256 350 256 375 Q 256 350 180 375 Z" fill="url(#gold)"/>
  <!-- Academic Cap on top of cross -->
  <polygon points="256,110 320,135 256,160 192,135" fill="url(#gold)"/>
  <rect x="250" y="150" width="12" height="25" fill="url(#gold)"/>
</svg>
